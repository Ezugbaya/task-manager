input {
  file {
    path => "/var/log/task-manager/task-manager.log"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/.sincedb_task_manager"
    codec => multiline {
      pattern => "^\d{4}-\d{2}-\d{2}T"
      negate => true
      what => "previous"
    }
  }
}

filter {
  grok {
    match => {
      "message" => "^%{TIMESTAMP_ISO8601:timestamp}\s+%{LOGLEVEL:level}\s+%{NUMBER:process_id}\s+---\s+\[%{DATA:application}\]\s+\[%{DATA:thread}\]\s+%{NOTSPACE:logger}\s*:\s*%{GREEDYDATA:log_message}$"
    }
    tag_on_failure => ["_grokparsefailure"]
  }

  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "task-manager-logs-fixed-%{+YYYY.MM.dd}"
  }
}
